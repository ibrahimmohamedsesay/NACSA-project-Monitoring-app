{% extends "base.html" %}{% load nacsa_tags %}
{% block content %}
<div class="page-head"><div><div class="crumbs"><a href="{% url 'beneficiaries:list' %}">Beneficiaries</a></div><h1>{{ page_title }}</h1></div></div>
<div class="card" style="max-width:820px"><form method="post" novalidate>{% csrf_token %}{% if form.non_field_errors %}<div class="alert error">{{ form.non_field_errors }}</div>{% endif %}<div class="form-grid">{% for f in form %}<div>{% field f %}</div>{% endfor %}</div>
{% if dup %}<label class="mb-s" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="confirm_duplicate" class="form-check"> Save anyway — this is a different person</label>{% endif %}
<div class="actions"><button class="btn btn-green" type="submit">Save</button><a class="btn btn-outline" href="{% url 'beneficiaries:list' %}">Cancel</a></div></form></div>
{% endblock %}
