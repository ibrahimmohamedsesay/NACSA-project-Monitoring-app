{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><div class="crumbs"><a href="{% url 'reports:index' %}">Reports</a></div><h1>{{ meta.0 }}</h1><div class="sub">{{ meta.1 }}</div></div></div>
<form class="filters" method="get"><input type="hidden" name="run" value="1">
{% if period %}<div class="ff"><label>Year</label><select name="year">{% for y in years %}<option {% if f.year == y|stringformat:"s" or forloop.last and not f.year %}selected{% endif %}>{{ y }}</option>{% endfor %}</select></div>
{% if kind == 'monthly' %}<div class="ff"><label>Month</label><select name="month">{% for n,l in months %}<option value="{{ n }}" {% if f.month == n|stringformat:"s" %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>{% endif %}
{% if kind == 'quarterly' %}<div class="ff"><label>Quarter</label><select name="quarter"><option value="1">Q1</option><option value="2">Q2</option><option value="3">Q3</option><option value="4">Q4</option></select></div>{% endif %}
{% else %}
<div class="ff"><label>District</label><select name="district"><option value="">All</option>{% for d in districts %}<option {% if f.district == d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></div>
<div class="ff"><label>Project</label><select name="project"><option value="">All</option>{% for p in projects %}<option value="{{ p.pk }}" {% if f.project == p.pk|stringformat:"s" %}selected{% endif %}>{{ p.project_id }} — {{ p.name|truncatechars:30 }}</option>{% endfor %}</select></div>
{% if kind == 'project' or kind == 'progress' or kind == 'district' %}<div class="ff"><label>Status</label><select name="status"><option value="">All</option>{% for v,l in statuses %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div><div class="ff"><label>Type</label><select name="type"><option value="">All</option>{% for t in types %}<option>{{ t }}</option>{% endfor %}</select></div>{% endif %}
<div class="ff"><label>From</label><input type="date" name="from" value="{{ f.from }}"></div><div class="ff"><label>To</label><input type="date" name="to" value="{{ f.to }}"></div>{% endif %}
<button class="btn btn-green" type="submit">Generate report</button></form>
{% endblock %}
