{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>{{ page_title }}</h1></div>
<div class="card" style="max-width:640px"><p>{{ message }}</p>
<form method="post">{% csrf_token %}<div class="actions"><button class="btn btn-danger" type="submit">{{ confirm_label|default:"Confirm" }}</button><a class="btn btn-outline" href="{{ cancel_url }}">Cancel</a></div></form></div>
{% endblock %}
