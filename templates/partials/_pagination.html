{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Pagination">
  {% if page.has_previous %}<a href="?{% if params %}{{ params }}&{% endif %}page={{ page.previous_page_number }}">‹ Prev</a>{% endif %}
  <span class="cur">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% if params %}{{ params }}&{% endif %}page={{ page.next_page_number }}">Next ›</a>{% endif %}
</nav>{% endif %}
